adminUsername:
  envVar: AUTHPROXY_ADMIN_USERNAME
  default: bobdole
adminPrivateKeyPath:
  path: ~/.authproxy/admin.key
server:
  api:
    envVar: AUTHPROXY_API_URL
    default: http://localhost:8081
  adminApi:
    templateEnvVars: http://{{AUTHPROXY_HOST}}:{{AUTHPROXY_ADMIN_API_PORT}}
    default: http://localhost:8082
  marketplace:
    envVar: AUTHPROXY_MARKETPLACE_URL
  adminUi:
    value: http://localhost:5174
