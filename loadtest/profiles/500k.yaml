name: 500k
namespace: authproxy-load
description: Stretch target profile for upper-bound capacity exploration.
cluster:
  target: real-cluster
objects:
  namespacesMin: 200000
  connections: 500000
  staleSetupConnections: 5000
  oauthTokensExpiringPercent:
    - 10
    - 50
    - 100
  periodicProbePercent:
    - 1
    - 10
    - 100
authproxy:
  apiReplicas: 8
  workerReplicas: 8
  # Public OAuth callbacks are not exercised by this proxy/cardinality profile.
  publicReplicas: 0
  adminApiReplicas: 1
k6:
  mode: operator
  scenario: proxy-raw
  rate: 1500
  duration: 10m
  timeUnit: 1s
  connectionRows: 10000
  parallelism: 12
  preAllocatedVus: 750
  maxVus: 6000
  requestTimeout: 30s
  p95LatencyMs: 1000
  maxFailedRate: 0.001
  upstreamStatus: 200
  upstreamBytes: 256
  upstreamDelayMs: 0
  upstreamJitterMs: 0
  upstreamBearerPrefix: at_
  upstreamPathPrefix: /test/load/resource/proxy
  soakDuration: 2h
  spikeBaseRate: 1500
  spikeRate: 4500
  spikeRampUp: 2m
  spikeHold: 5m
  spikeRampDown: 2m
  spikeRecovery: 5m
  scaleReplicas:
    - 8
    - 16
acceptance:
  max5xxRate: 0.001
  p95LatencyTarget: profile-configured
  refreshSweepMustDrainBeforeNextCron: true
