name: 100k
namespace: authproxy-load
description: Baseline high-cardinality target profile.
cluster:
  target: real-cluster
objects:
  namespacesMin: 50000
  namespacesMax: 100000
  connections: 100000
  staleSetupConnections: 1000
  oauthTokensExpiringPercent:
    - 10
    - 50
    - 100
  periodicProbePercent:
    - 1
    - 10
    - 100
authproxy:
  apiReplicas: 2
  workerReplicas: 2
  # Public OAuth callbacks are not exercised by this proxy/cardinality profile.
  publicReplicas: 0
  adminApiReplicas: 1
k6:
  mode: operator
  scenario: proxy-raw
  rate: 500
  duration: 10m
  timeUnit: 1s
  connectionRows: 10000
  parallelism: 4
  preAllocatedVus: 250
  maxVus: 2000
  requestTimeout: 30s
  p95LatencyMs: 1000
  maxFailedRate: 0.001
  upstreamStatus: 200
  upstreamBytes: 256
  upstreamDelayMs: 0
  upstreamJitterMs: 0
  upstreamBearerPrefix: at_
  upstreamPathPrefix: /test/load/resource/proxy
  soakDuration: 2h
  spikeBaseRate: 500
  spikeRate: 1500
  spikeRampUp: 2m
  spikeHold: 5m
  spikeRampDown: 2m
  spikeRecovery: 5m
  scaleReplicas:
    - 2
    - 4
    - 8
    - 16
acceptance:
  max5xxRate: 0.001
  p95LatencyTarget: profile-configured
  refreshSweepMustDrainBeforeNextCron: true
