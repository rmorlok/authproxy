name: 250k
namespace: authproxy-load
description: Larger cardinality target profile for database, scheduler, and worker pressure.
cluster:
  target: real-cluster
objects:
  namespacesMin: 100000
  connections: 250000
  staleSetupConnections: 2500
  oauthTokensExpiringPercent:
    - 10
    - 50
    - 100
  periodicProbePercent:
    - 1
    - 10
    - 100
authproxy:
  apiReplicas: 4
  workerReplicas: 4
  # Public OAuth callbacks are not exercised by this proxy/cardinality profile.
  publicReplicas: 0
  adminApiReplicas: 1
k6:
  mode: operator
  scenario: proxy-raw
  rate: 1000
  duration: 10m
  timeUnit: 1s
  connectionRows: 10000
  parallelism: 8
  preAllocatedVus: 500
  maxVus: 4000
  requestTimeout: 30s
  p95LatencyMs: 1000
  maxFailedRate: 0.001
  upstreamStatus: 200
  upstreamBytes: 256
  upstreamDelayMs: 0
  upstreamJitterMs: 0
  upstreamBearerPrefix: at_
  upstreamPathPrefix: /test/load/resource/proxy
  soakDuration: 2h
  spikeBaseRate: 1000
  spikeRate: 3000
  spikeRampUp: 2m
  spikeHold: 5m
  spikeRampDown: 2m
  spikeRecovery: 5m
  scaleReplicas:
    - 4
    - 8
    - 16
acceptance:
  max5xxRate: 0.001
  p95LatencyTarget: profile-configured
  refreshSweepMustDrainBeforeNextCron: true
