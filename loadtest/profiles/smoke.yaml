name: smoke
namespace: authproxy-load
description: Minimal Kubernetes smoke test for the load-test harness.
cluster:
  target: local-or-small-cluster
objects:
  namespaces: 10
  connections: 10
  staleSetupConnections: 2
  oauthTokensExpiringPercent: 0
  periodicProbePercent: 0
authproxy:
  apiReplicas: 2
  workerReplicas: 1
  publicReplicas: 1
  adminApiReplicas: 1
k6:
  mode: job
  scenario: smoke
  rate: 2
  duration: 30s
  connectionRows: 10
  preAllocatedVus: 4
  maxVus: 16
acceptance:
  max5xxRate: 0.001
  p95LatencyTarget: 500ms
