image:
  repository: ghcr.io/rmorlok/authproxy
  tag: main
  pullPolicy: IfNotPresent

serviceAccount:
  create: true

migrationJob:
  enabled: false

# `up` installs or reuses one cluster-level KEDA controller before these role
# releases. Do not render a controller for each independently scaled release.
keda:
  enabled: false

services:
  api:
    enabled: false
  adminApi:
    enabled: false
    ui:
      enabled: false
    static:
      enabled: false
  public:
    enabled: false
    enableProxy: false
    static:
      enabled: false
  worker:
    enabled: false

database:
  provider: postgres
  host: postgresql
  port: 5432
  database: authproxy
  user: authproxy
  sslmode: disable
  existingSecret: authproxy-load-db

redis:
  provider: redis
  address: redis-master:6379
  db: 0
  existingSecret: authproxy-load-redis

jwt:
  existingSecret: authproxy-load-jwt

encryptionKeys:
  existingSecret: authproxy-load-encryption

actors:
  existingSecret: authproxy-load-actors
  permissions:
    - namespace: root.**
      resources:
        - "*"
      verbs:
        - "*"

hostApplication:
  initiateSessionUrl: http://authproxy-admin-api:8082/login

blobStorage:
  provider: filesystem
  filesystem:
    path: /tmp/authproxy-blobs
    emptyDir: true

connectors:
  loadFromList: []

appMetrics:
  shareMainDatabase: false
  existingSecret: authproxy-load-clickhouse
  database:
    provider: clickhouse
    addresses:
      - clickhouse:8123
    database: authproxy_app_metrics
    user: authproxy
    password:
      envVar: CLICKHOUSE_PASSWORD
  fullRequestRecording: never

config:
  connections:
    setupTtl: 1s
  tasks:
    defaultRetention: 24h
  telemetry:
    enabled: true
    exporter:
      protocol: grpc
      endpoint: http://otel-lgtm:4317
      insecure: true
    resource:
      serviceNamePrefix: authproxy-load
      attributes:
        deployment.environment: loadtest
    sampling:
      ratio: 1.0
    signals:
      traces: false
      metrics: true
      logs: true
    http:
      excludedPaths:
        - /ping
        - /healthz
    proxy:
      spanAttributeLabels:
        - loadtest
      metricDimensionLabels:
        - loadtest
      metricDimensionValueCap: 25
