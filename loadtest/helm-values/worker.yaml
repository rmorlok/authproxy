replicaCount: 1

autoscaling:
  enabled: false

queueAutoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 8
  pollingInterval: 15
  cooldownPeriod: 300
  prometheus:
    serverAddress: http://prometheus-loadtest:9090
    query: 'max(authproxy_asynq_queue_size{messaging_destination_name="default"})'
    threshold: "100"
    activationThreshold: "1"
  cpu:
    enabled: true
    targetUtilizationPercentage: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

services:
  worker:
    enabled: true

worker:
  workflowPollers: 8
  activityPollers: 16
  maxParallelWorkflowTasks: 32
  maxParallelActivityTasks: 64

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi
