# Docker-specific configuration
# Used when running the server via docker compose --profile server up

public:
  port: 8080
  cookie:
    sameSite: none
  tls:
    autoGenPath: /app/dev_config/keys/tls/
  static: {}  # Serve the embedded marketplace UI at the service root.

api:
  port: 8081

adminApi:
  port: 8082
  ui:
    enabled: true
    baseUrl: http://localhost:5174
    initiateSessionUrl: http://host.docker.internal:8888/login-redirect
  cookie:
    sameSite: none
  tls:
    autoGenPath: /app/dev_config/keys/tls/
  static: {}  # Serve the embedded admin UI at the service root.

worker:
  healthCheckPort:
    envVar: HEALTH_CHECK_PORT
    default: 8083
  cronSyncInterval: 1m

tasks:
  defaultRetention: 24h

hostApplication:
  initiateSessionUrl: http://host.docker.internal:8888/login-redirect

marketplace:
  baseUrl: http://localhost:5173
  colorMode: system

systemAuth:
  jwtSigningKey:
    publicKey:
      path: /app/dev_config/keys/system.pub
    privateKey:
      path: /app/dev_config/keys/system
  actors:
    root:
      keysPath: /app/dev_config/keys/admin
      permissions:
        - namespace: root.**
          resources:
            - "*"
          verbs:
            - "*"
  globalAesKey:
    path: /app/dev_config/keys/global_aes.key

errorPages:
  internalError: https://example.com

database:
  provider: postgres
  host: postgres
  port: 5432
  user: postgres
  password: postgres
  database: authproxy
  sslmode: disable

logging:
  type: tint
  level: debug

appMetrics:
  resourceSnapshotInterval: 15m
  requestEvents:
    fullRequestRecording: always
  database:
    provider: clickhouse
    user: authproxy
    password: authproxy
    addresses:
      - clickhouse:8123
    database: authproxy
  blobStorage:
    provider: s3
    endpoint: http://minio:9000
    region: us-east-1
    bucket: authproxy-request-logs
    credentials:
      type: access_key
      accessKeyId: minioadmin
      secretAccessKey: minioadmin
    forcePathStyle: true
    prefix: "rlf/"

redis:
  provider: redis
  address: redis:6379

oauth:
  roundTripTtl: 60m

connectors:
  autoMigrationLockDuration: 30s
  loadFromList:
  #
  # Root
  #
  - name: google-drive
    labels:
      type: google-drive
      env: prod
    displayName: Google Drive
    logo:
      publicUrl: https://upload.wikimedia.org/wikipedia/commons/thumb/1/12/Google_Drive_icon_%282020%29.svg/1024px-Google_Drive_icon_%282020%29.svg.png?20221103153031
    highlight: |
      Have the agent track your work in Google Drive.
    description: |
      This integration connects Google Drive to Acme app.
    auth:
      type: OAuth2
      clientId:
        envVar: GOOGLE_CLIENT_ID
      clientSecret:
        envVar: GOOGLE_CLIENT_SECRET
      authorization:
        endpoint: https://accounts.google.com/o/oauth2/v2/auth
        queryOverrides:
          prompt: consent
      token:
        endpoint: https://oauth2.googleapis.com/token
      revocation:
        endpoint: https://oauth2.googleapis.com/revoke
        supportedTokens: refresh_token
      scopes:
        - id: https://www.googleapis.com/auth/drive.readonly
          reason: |
            We need to be able to view the files
