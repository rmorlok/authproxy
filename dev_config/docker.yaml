# Docker-specific configuration
# Used when running the server via docker compose --profile server up

public:
  port: 8080
  cookie:
    sameSite: none
  tls:
    autoGenPath: /app/dev_config/keys/tls/
  static: {}  # Serve the embedded marketplace UI at the service root.

api:
  port: 8081

adminApi:
  port: 8082
  ui:
    enabled: true
    baseUrl: http://localhost:5174
    initiateSessionUrl: http://host.docker.internal:8888/login-redirect
  cookie:
    sameSite: none
  tls:
    autoGenPath: /app/dev_config/keys/tls/
  static: {}  # Serve the embedded admin UI at the service root.

worker:
  healthCheckPort:
    envVar: HEALTH_CHECK_PORT
    default: 8083
  cronSyncInterval: 1m

tasks:
  defaultRetention: 24h

hostApplication:
  initiateSessionUrl: http://host.docker.internal:8888/login-redirect

marketplace:
  baseUrl: http://localhost:5173
  colorMode: system

systemAuth:
  jwtSigningKey:
    publicKey:
      path: /app/dev_config/keys/system.pub
    privateKey:
      path: /app/dev_config/keys/system
  actors:
    root:
      keysPath: /app/dev_config/keys/admin
      permissions:
        - namespace: root.**
          resources:
            - "*"
          verbs:
            - "*"
  globalAesKey:
    path: /app/dev_config/keys/global_aes.key

errorPages:
  internalError: https://example.com

database:
  provider: postgres
  host: postgres
  port: 5432
  user: postgres
  password: postgres
  database: authproxy
  sslmode: disable

logging:
  type: tint
  level: debug

appMetrics:
  resourceSnapshotInterval: 15m
  requestEvents:
    fullRequestRecording: always
  database:
    provider: clickhouse
    user: authproxy
    password: authproxy
    addresses:
      - clickhouse:8123
    database: authproxy
  blobStorage:
    provider: s3
    endpoint: http://seaweedfs:8333
    region: us-east-1
    bucket: authproxy-request-logs
    credentials:
      type: access_key
      accessKeyId: authproxy
      secretAccessKey: authproxy-local-secret
    forcePathStyle: true
    prefix: "rlf/"

redis:
  provider: redis
  address: redis:6379

oauth:
  roundTripTtl: 60m
