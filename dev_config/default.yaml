# $schema: ../config/schema.json

public:
  port:
    envVar: AUTHPROXY_PUBLIC_PORT
    default: 8080
  cookie:
    sameSite: none
  tls:
    autoGenPath: ./dev_config/keys/tls/

api:
  port:
    envVar: AUTHPROXY_API_PORT
    default: 8081

adminApi:
  port:
    envVar: AUTHPROXY_ADMIN_API_PORT
    default: 8082
  ui:
    enabled: true
    baseUrl:
      envVar: AUTHPROXY_ADMIN_UI_BASE_URL
      default: http://localhost:5174
    initiateSessionUrl:
      envVar: AUTHPROXY_HOST_APP_INITIATE_SESSION_URL
      default: http://127.0.0.1:8888/login-redirect
  cookie:
    sameSite: none
  tls:
    autoGenPath: ./dev_config/keys/tls/

worker:
  healthCheckPort:
    envVar: AUTHPROXY_WORKER_HEALTH_PORT
    default: 8083
  cronSyncInterval: 1m

tasks:
  defaultRetention: 24h

hostApplication:
  initiateSessionUrl:
    envVar: AUTHPROXY_HOST_APP_INITIATE_SESSION_URL
    default: http://127.0.0.1:8888/login-redirect

marketplace:
  baseUrl:
    envVar: AUTHPROXY_MARKETPLACE_BASE_URL
    default: http://localhost:5173

systemAuth:
  jwtSigningKey:
    publicKey:
      path: ./dev_config/keys/system.pub
    privateKey:
      path: ./dev_config/keys/system
  actors:
    keysPath: ./dev_config/keys/admin
    permissions:
      - namespace: root.**
        resources:
          - "*"
        verbs:
          - "*"
  globalAesKey:
    path: ./dev_config/keys/global_aes.key

errorPages:
  internalError: https://example.com/500.html

database:
  provider: postgres
  autoMigrate: true
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  database: authproxy
  sslmode: disable

logging:
  type: tint
  level: debug

appMetrics:
  resourceSnapshotInterval: 15m
  requestEvents:
    fullRequestRecording: always
  # fullRequestRecording: never
  #  database:
  #    provider: sqlite
  #    autoMigrate: true
  #    path: ./dev_config/app_metrics.db
  database:
    provider: clickhouse
    autoMigrate: true
    user: authproxy
    password: authproxy
    addresses:
      - localhost:8123
    database: authproxy
  blobStorage:
    provider: s3
    endpoint: http://localhost:9000
    region: us-east-1
    bucket: authproxy-request-logs
    credentials:
      type: access_key
      accessKeyId:
        envVar: MINIO_ACCESS_KEY
        default: minioadmin
      secretAccessKey:
        envVar: MINIO_SECRET_KEY
        default: minioadmin
    forcePathStyle: true
    prefix: "rlf/"

#redis:
#  provider: miniredis
redis:
  provider: redis
  address: localhost:6379

oauth:
  roundTripTtl: 60m

# OpenTelemetry settings. The whole block is endpoint-gated: when
# AUTHPROXY_OTEL_ENDPOINT is unset, exporter.endpoint resolves to empty
# and the SDK falls through to no-op providers. To activate the dev
# observability sample (grafana/otel-lgtm) run:
#
#   docker compose --profile observability up -d
#   export AUTHPROXY_OTEL_ENDPOINT=http://localhost:4317
#
# then start the AuthProxy services. Telemetry flows into the bundled
# Grafana at http://localhost:3000 (no login). See docs/src/content/docs/operations/telemetry.md for
# the full reference.
telemetry:
  enabled: true
  exporter:
    protocol: grpc
    endpoint:
      envVar: AUTHPROXY_OTEL_ENDPOINT
      default: ""
    insecure: true
  resource:
    serviceNamePrefix: authproxy
    attributes:
      deployment.environment: dev
  sampling:
    ratio: 1.0
  signals:
    traces: true
    metrics: true
    logs: true
  http:
    excludedPaths:
      - /ping
      - /healthz
  proxy:
    # Project an allowlisted subset of connection labels onto proxy
    # metrics + spans. `type` is an ordinary connector label used by the
    # Grafana "Proxy RED" dashboard's per-`type` panel.
    spanAttributeLabels:
      - type
      - env
    metricDimensionLabels:
      - type
      - env
    metricDimensionValueCap: 50
  propagation:
    injectOutboundDefault: false

connectors:
  autoMigrate: true
  autoMigrationLockDuration: 30s
  loadFromList:
  #
  # Root
  #
  - name: google-drive
    labels:
      type: google-drive
      env: prod
    displayName: Google Drive
    logo:
      publicUrl: https://upload.wikimedia.org/wikipedia/commons/thumb/1/12/Google_Drive_icon_%282020%29.svg/3840px-Google_Drive_icon_%282020%29.svg.png
    highlight: |
      Have the agent track your work in Google Drive.
    description: | 
      This integration connects Google Drive to Acme app. This has the following advantages:
      
      1. Some reason
      2. Some other reason
      3. Even better reason
      4. More reasons
      
      More information [here](https://example.com) if interested.
    auth:
      type: OAuth2
      clientId:
        envVar: GOOGLE_CLIENT_ID
      clientSecret:
        envVar: GOOGLE_CLIENT_SECRET
      authorization:
        endpoint: https://accounts.google.com/o/oauth2/v2/auth
        queryOverrides:
          prompt: consent
      token:
        endpoint: https://oauth2.googleapis.com/token
      revocation:
        endpoint: https://oauth2.googleapis.com/revoke
        supportedTokens: refresh_token
      scopes:
        - id: https://www.googleapis.com/auth/drive.readonly
          reason: |
            We need to be able to view the files
        - id: https://www.googleapis.com/auth/drive.activity.readonly
          required: false
          reason: |
            We need to be able to see what's been going on in drive
  - name: greenhouse
    labels:
      type: greenhouse
      env: prod
    displayName: Greenhouse
    logo:
      base64: 
      mimeType: image/png
    description: |
      This integration pushes candidates to greenhouse
    auth:
      type: api-key
      placement:
        type: bearer
  - name: google-calendar
    labels:
      type: google-calendar
      env: prod
    displayName: Google Calendar
    logo:
      publicUrl: https://upload.wikimedia.org/wikipedia/commons/a/a5/Google_Calendar_icon_%282020%29.svg
    description: |
      Allow the agent to manage your calendar on your behalf. It's like having your own personal assistant!!
    auth:
      type: OAuth2
      clientId:
        envVar: GOOGLE_CLIENT_ID
      clientSecret:
        envVar: GOOGLE_CLIENT_SECRET
      authorization:
        endpoint: https://accounts.google.com/o/oauth2/v2/auth
        queryOverrides:
          prompt: consent
      token:
        endpoint: https://oauth2.googleapis.com/token
      revocation:
        endpoint: https://oauth2.googleapis.com/revoke
        supportedTokens: refresh_token
      scopes:
        - id: https://www.googleapis.com/auth/calendar.readonly
          reason: |
            We need to be able to read the calendar
    javascript: |
      function isPrimaryCalendar(cfg) {
        return cfg.calendar_id === "primary";
      }

      function transformCalendarItems(items) {
        return items.map(function(c) {
          return { value: c.id, label: c.summary || c.id };
        });
      }
    setupFlow:
      configure:
        steps:
          - id: select-calendar
            title: Select a Calendar
            description: Choose which Google Calendar the agent should manage.
            jsonSchema:
              type: object
              required:
                - calendar_id
              properties:
                calendarId:
                  type: string
                  title: Calendar
                  x-data-source: calendars
            uiSchema:
              type: VerticalLayout
              elements:
                - type: Control
                  scope: "#/properties/calendar_id"
            dataSources:
              calendars:
                proxyRequest:
                  method: GET
                  url: https://www.googleapis.com/calendar/v3/users/me/calendarList
                transform: transformCalendarItems(data.items)
          - id: primary-calendar-options
            title: Primary Calendar Options
            description: Configure behavior that only applies to the primary calendar.
            if:
              javascript: isPrimaryCalendar(cfg)
            jsonSchema:
              type: object
              properties:
                includeDeclined:
                  type: boolean
                  title: Include declined events
            uiSchema:
              type: VerticalLayout
              elements:
                - type: Control
                  scope: "#/properties/include_declined"
    probes:
      - id: example
        period: 1m
        http:
          method: GET
          url: https://example.com/
      - id: calendar-list
        period: 30s
        proxyHttp:
          method: GET
          url: https://www.googleapis.com/calendar/v3/users/me/calendarList
      - id: calendar-list-2
        period: 2m
        proxyHttp:
          method: GET
          url: https://www.googleapis.com/calendar/v3/users/me/calendarList
  - name: gmail
    labels:
      type: gmail
      env: prod
    displayName: GMail
    logo:
      publicUrl: https://upload.wikimedia.org/wikipedia/commons/thumb/7/7e/Gmail_icon_%282020%29.svg/3840px-Gmail_icon_%282020%29.svg.png
    description: |
      Have the agent respond to your emails without you needing to be involved. Like magic.
    auth:
      type: OAuth2
      clientId:
        envVar: GOOGLE_CLIENT_ID
      clientSecret:
        envVar: GOOGLE_CLIENT_SECRET
      authorization:
        endpoint: https://accounts.google.com/o/oauth2/v2/auth
        queryOverrides:
          prompt: consent
      token:
        endpoint: https://oauth2.googleapis.com/token
      revocation:
        endpoint: https://oauth2.googleapis.com/revoke
        supportedTokens: refresh_token
      scopes:
        - id: https://www.googleapis.com/auth/gmail.readonly
          reason: |
            We need to be able to read your emails
  - name: pipedrive
    labels:
      type: pipedrive
      env: prod
    displayName: pipedrive
    logo:
      publicUrl: https://mms.businesswire.com/media/20251027073467/en/2621697/5/Pipedrive_Logo_Green.jpg
    description: |
      Allow our agent to handle your sales support.
    auth:
      type: OAuth2
      clientId:
        envVar: PIPEDRIVE_CLIENT_ID
      clientSecret:
        envVar: PIPEDRIVE_CLIENT_SECRET
      authorization:
        endpoint: https://oauth.pipedrive.com/oauth/authorize
      token:
        endpoint: https://oauth.pipedrive.com/oauth/token
      scopes:
        - id: base
          reason: |
            We need access to core information
        - id: deals:read
          reason: |
            Allows us to give information about open deals
        - id: webhooks:full
          reason: |
            Allows us to receive notification of changes in realtime
  - name: asana
    labels:
      type: asana
      env: prod
    displayName: Asana
    logo:
      publicUrl: https://assets.asana.biz/m/5f083bc48e06e1e2/original/asana-logo-1200x1200.png
    description: |
      Allow our agent organize your work
    auth:
      type: OAuth2
      clientId:
        envVar: ASANA_CLIENT_ID
      clientSecret:
        envVar: ASANA_CLIENT_SECRET
      authorization:
        endpoint: https://app.asana.com/-/oauth_authorize
      token:
        endpoint: https://app.asana.com/-/oauth_token
      scopes:
        - id: projects:read
          reason: |
            We need access to see the projects
        - id: tasks:read
          reason: |
            Allows us to give information about open tasks
        - id: users:read
          reason: |
            Allows us to map work to who is responsible
