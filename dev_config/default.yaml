# $schema: ../config/schema.json

public:
  port:
    envVar: AUTHPROXY_PUBLIC_PORT
    default: 8080
  cookie:
    sameSite: none
  tls:
    autoGenPath: ./dev_config/keys/tls/

api:
  port:
    envVar: AUTHPROXY_API_PORT
    default: 8081

adminApi:
  port:
    envVar: AUTHPROXY_ADMIN_API_PORT
    default: 8082
  ui:
    enabled: true
    baseUrl:
      envVar: AUTHPROXY_ADMIN_UI_BASE_URL
      default: http://localhost:5174
    initiateSessionUrl:
      envVar: AUTHPROXY_HOST_APP_INITIATE_SESSION_URL
      default: http://127.0.0.1:8888/login-redirect
  cookie:
    sameSite: none
  tls:
    autoGenPath: ./dev_config/keys/tls/

worker:
  healthCheckPort:
    envVar: AUTHPROXY_WORKER_HEALTH_PORT
    default: 8083
  cronSyncInterval: 1m

tasks:
  defaultRetention: 24h

hostApplication:
  initiateSessionUrl:
    envVar: AUTHPROXY_HOST_APP_INITIATE_SESSION_URL
    default: http://127.0.0.1:8888/login-redirect

marketplace:
  baseUrl:
    envVar: AUTHPROXY_MARKETPLACE_BASE_URL
    default: http://localhost:5173
  colorMode: system

systemAuth:
  jwtSigningKey:
    publicKey:
      path: ./dev_config/keys/system.pub
    privateKey:
      path: ./dev_config/keys/system
  actors:
    root:
      keysPath: ./dev_config/keys/admin
      permissions:
        - namespace: root.**
          resources:
            - "*"
          verbs:
            - "*"
  globalAesKey:
    path: ./dev_config/keys/global_aes.key

errorPages:
  internalError: https://example.com/500.html

database:
  provider: postgres
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  database: authproxy
  sslmode: disable

logging:
  type: tint
  level: debug

appMetrics:
  resourceSnapshotInterval: 15m
  requestEvents:
    fullRequestRecording: always
  # fullRequestRecording: never
  #  database:
  #    provider: sqlite
  #    path: ./dev_config/app_metrics.db
  database:
    provider: clickhouse
    user: authproxy
    password: authproxy
    addresses:
      - localhost:8123
    database: authproxy
  blobStorage:
    provider: s3
    endpoint: http://localhost:9000
    region: us-east-1
    bucket: authproxy-request-logs
    credentials:
      type: access_key
      accessKeyId:
        envVar: S3_ACCESS_KEY
        default: authproxy
      secretAccessKey:
        envVar: S3_SECRET_KEY
        default: authproxy-local-secret
    forcePathStyle: true
    prefix: "rlf/"

#redis:
#  provider: miniredis
redis:
  provider: redis
  address: localhost:6379

oauth:
  roundTripTtl: 60m

# OpenTelemetry settings. The whole block is endpoint-gated: when
# AUTHPROXY_OTEL_ENDPOINT is unset, exporter.endpoint resolves to empty
# and the SDK falls through to no-op providers. To activate the dev
# observability sample (grafana/otel-lgtm) run:
#
#   docker compose --profile observability up -d
#   export AUTHPROXY_OTEL_ENDPOINT=http://localhost:4317
#
# then start the AuthProxy services. Telemetry flows into the bundled
# Grafana at http://localhost:3000 (no login). See docs/src/content/docs/operations/telemetry.md for
# the full reference.
telemetry:
  enabled: true
  exporter:
    protocol: grpc
    endpoint:
      envVar: AUTHPROXY_OTEL_ENDPOINT
      default: ""
    insecure: true
  resource:
    serviceNamePrefix: authproxy
    attributes:
      deployment.environment: dev
  sampling:
    ratio: 1.0
  signals:
    traces: true
    metrics: true
    logs: true
  http:
    excludedPaths:
      - /ping
      - /healthz
  proxy:
    # Project an allowlisted subset of connection labels onto proxy
    # metrics + spans. `type` is an ordinary connector label used by the
    # Grafana "Proxy RED" dashboard's per-`type` panel.
    spanAttributeLabels:
      - type
      - env
    metricDimensionLabels:
      - type
      - env
    metricDimensionValueCap: 50
  propagation:
    injectOutboundDefault: false
