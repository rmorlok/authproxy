basePath: /api/v1
definitions:
  api.ActorJson:
    description: Actor identity within a namespace
    properties:
      annotations:
        additionalProperties:
          type: string
        type: object
      createdAt:
        type: string
      externalId:
        example: user-123
        type: string
      id:
        example: act_test550e8400abcde
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      name:
        example: billing-service
        type: string
      namespace:
        example: root.acme
        type: string
      updatedAt:
        type: string
    type: object
  api.ConnectorJson:
    description: Connector API summary response
    properties:
      annotations:
        additionalProperties:
          type: string
        type: object
      createdAt:
        type: string
      description:
        example: Salesforce CRM integration
        type: string
      displayName:
        example: Salesforce
        type: string
      hasConfigure:
        example: false
        type: boolean
      highlight:
        example: CRM platform
        type: string
      id:
        example: cxr_test550e8400abcde
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      logo:
        example: https://example.com/logo.png
        type: string
      name:
        example: salesforce
        type: string
      namespace:
        example: root.acme
        type: string
      state:
        example: primary
        type: string
      statusPageUrl:
        example: https://status.salesforce.com
        type: string
      updatedAt:
        type: string
      version:
        example: 1
        type: integer
    type: object
  api.MetricsSchemaMetricJson:
    description: Supported metric definition
    properties:
      aggregations:
        example:
        - count
        items:
          type: string
        type: array
      groupBy:
        example:
        - method
        - response_status_code
        items:
          type: string
        type: array
      kind:
        example: counter
        type: string
      metric:
        example: request_events
        type: string
    type: object
  key.KeyStatus:
    properties:
      keyDataConfigured:
        type: boolean
      state:
        type: string
    type: object
  meta.APIVersion:
    enum:
    - authproxy.net/v1alpha1
    type: string
    x-enum-varnames:
    - APIVersionV1Alpha1
  meta.ObjectMeta:
    properties:
      annotations:
        additionalProperties:
          type: string
        type: object
      createdAt:
        type: string
      generation:
        type: integer
      id:
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
      namespace:
        type: string
      updatedAt:
        type: string
    type: object
  meta.ObjectMetaPatch:
    properties:
      annotations:
        additionalProperties:
          type: string
        type: object
      createdAt:
        type: string
      generation:
        type: integer
      id:
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
      namespace:
        type: string
      updatedAt:
        type: string
    type: object
  meta.ObjectReference:
    properties:
      apiVersion:
        $ref: '#/definitions/meta.APIVersion'
      generation:
        type: integer
      id:
        type: string
      kind:
        type: string
      name:
        type: string
      namespace:
        type: string
    type: object
  namespace.Namespace:
    properties:
      apiVersion:
        $ref: '#/definitions/meta.APIVersion'
      kind:
        type: string
      metadata:
        $ref: '#/definitions/meta.ObjectMeta'
      spec:
        $ref: '#/definitions/namespace.NamespaceSpec'
      status:
        $ref: '#/definitions/namespace.NamespaceStatus'
    type: object
  namespace.NamespacePatch:
    properties:
      apiVersion:
        $ref: '#/definitions/meta.APIVersion'
      kind:
        type: string
      metadata:
        $ref: '#/definitions/meta.ObjectMetaPatch'
      spec:
        $ref: '#/definitions/namespace.NamespaceSpecPatch'
      status:
        $ref: '#/definitions/namespace.NamespaceStatus'
    type: object
  namespace.NamespaceSpec:
    properties:
      encryptionKeyRef:
        $ref: '#/definitions/meta.ObjectReference'
    type: object
  namespace.NamespaceSpecPatch:
    properties:
      encryptionKeyRef:
        $ref: '#/definitions/meta.ObjectReference'
    type: object
  namespace.NamespaceStatus:
    properties:
      state:
        type: string
    type: object
  openapi.ConnectionJson:
    description: Connection to an external service
    properties:
      annotations:
        additionalProperties:
          type: string
        type: object
      connector: {}
      createdAt:
        type: string
      healthState:
        example: healthy
        type: string
      id:
        example: cxn_test550e8400abcde
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      name:
        example: production-crm
        type: string
      namespace:
        example: root.acme
        type: string
      setupError:
        type: string
      setupStepId:
        example: tenant
        type: string
      state:
        example: configured
        type: string
      updatedAt:
        type: string
    type: object
  openapi.ConnectorVersionJson:
    description: Detailed connector version information
    properties:
      annotations:
        additionalProperties:
          type: string
        type: object
      createdAt:
        type: string
      definition: {}
      id:
        example: cxr_test550e8400abcde
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      name:
        example: salesforce
        type: string
      namespace:
        example: root.acme
        type: string
      state:
        example: primary
        type: string
      updatedAt:
        type: string
      version:
        example: 1
        type: integer
    type: object
  openapi.DryRunRequestJson:
    description: 'Dry-run input: a proxy-shaped request + request type + the identity
      it runs under'
    properties:
      context: {}
      request: {}
      requestType:
        example: proxy
        type: string
    type: object
  openapi.DryRunResponseJson:
    description: Per-rule match + peek-driven would-allow result
    properties:
      matched:
        items: {}
        type: array
      notMatched:
        items: {}
        type: array
      requestLabelSnapshot:
        additionalProperties:
          type: string
        type: object
    type: object
  openapi.KeyJson:
    description: Kubernetes-style managed Key resource. Secret keyData fields are
      always redacted in responses.
    properties:
      apiVersion:
        enum:
        - authproxy.net/v1alpha1
        example: authproxy.net/v1alpha1
        type: string
      kind:
        enum:
        - Key
        example: Key
        type: string
      metadata:
        $ref: '#/definitions/meta.ObjectMeta'
      spec:
        $ref: '#/definitions/openapi.KeySpecJson'
      status:
        $ref: '#/definitions/key.KeyStatus'
    required:
    - apiVersion
    - kind
    - metadata
    - spec
    type: object
  openapi.KeyPatchJson:
    description: Kubernetes-style managed Key patch. Status and server-owned metadata
      are rejected.
    properties:
      apiVersion:
        enum:
        - authproxy.net/v1alpha1
        example: authproxy.net/v1alpha1
        type: string
      kind:
        enum:
        - Key
        example: Key
        type: string
      metadata:
        $ref: '#/definitions/meta.ObjectMetaPatch'
      spec:
        $ref: '#/definitions/openapi.KeySpecPatchJson'
      status:
        $ref: '#/definitions/key.KeyStatus'
    required:
    - apiVersion
    - kind
    - metadata
    - spec
    type: object
  openapi.KeySpecJson:
    properties:
      desiredState:
        enum:
        - active
        - disabled
        type: string
      keyData:
        type: object
      materialType:
        enum:
        - symmetric
        - public
        - private
        - external
        type: string
      usage:
        enum:
        - data_encryption
        type: string
    type: object
  openapi.KeySpecPatchJson:
    properties:
      desiredState:
        enum:
        - active
        - disabled
        type: string
      keyData:
        type: object
      materialType:
        enum:
        - symmetric
        - public
        - private
        - external
        type: string
      usage:
        enum:
        - data_encryption
        type: string
    type: object
  openapi.ListKeysResponseJson:
    description: Paginated list of keys
    properties:
      apiVersion:
        enum:
        - authproxy.net/v1alpha1
        example: authproxy.net/v1alpha1
        type: string
      items:
        items:
          $ref: '#/definitions/openapi.KeyJson'
        type: array
      kind:
        type: string
      metadata:
        $ref: '#/definitions/v1alpha1.ListMeta'
    required:
    - apiVersion
    - items
    - kind
    - metadata
    type: object
  openapi.ListNamespacesResponseJson:
    description: Paginated list of namespaces
    properties:
      apiVersion:
        enum:
        - authproxy.net/v1alpha1
        example: authproxy.net/v1alpha1
        type: string
      items:
        description: List of namespaces.
        items:
          $ref: '#/definitions/namespace.Namespace'
        type: array
      kind:
        type: string
      metadata:
        $ref: '#/definitions/v1alpha1.ListMeta'
    required:
    - apiVersion
    - items
    - kind
    - metadata
    type: object
  openapi.ListRateLimitsResponseJson:
    description: Paginated list of rate limits
    properties:
      apiVersion:
        enum:
        - authproxy.net/v1alpha1
        example: authproxy.net/v1alpha1
        type: string
      items:
        items:
          $ref: '#/definitions/openapi.RateLimitJson'
        type: array
      kind:
        type: string
      metadata:
        $ref: '#/definitions/v1alpha1.ListMeta'
    required:
    - apiVersion
    - items
    - kind
    - metadata
    type: object
  openapi.RateLimitAlgorithmJson:
    properties:
      fixedWindow:
        $ref: '#/definitions/openapi.RateLimitFixedWindowJson'
      slidingWindow:
        $ref: '#/definitions/openapi.RateLimitSlidingWindowJson'
      tokenBucket:
        $ref: '#/definitions/openapi.RateLimitTokenBucketJson'
    type: object
  openapi.RateLimitBucketJson:
    properties:
      dimensions:
        items:
          type: string
        type: array
    type: object
  openapi.RateLimitConnectionReferenceJson:
    properties:
      apiVersion:
        enum:
        - authproxy.net/v1alpha1
        example: authproxy.net/v1alpha1
        type: string
      id:
        example: cxn_01example
        type: string
      kind:
        enum:
        - Connection
        example: Connection
        type: string
      name:
        example: salesforce-production
        type: string
      namespace:
        example: root.acme
        type: string
    required:
    - apiVersion
    - kind
    type: object
  openapi.RateLimitConnectorReferenceJson:
    properties:
      apiVersion:
        enum:
        - authproxy.net/v1alpha1
        example: authproxy.net/v1alpha1
        type: string
      id:
        example: cxr_01example
        type: string
      kind:
        enum:
        - Connector
        example: Connector
        type: string
      name:
        example: salesforce
        type: string
      namespace:
        example: root.acme
        type: string
    required:
    - apiVersion
    - kind
    type: object
  openapi.RateLimitFixedWindowJson:
    properties:
      limit:
        example: 100
        type: integer
      window:
        example: 1m
        type: string
    type: object
  openapi.RateLimitJson:
    description: Kubernetes-style RateLimit resource
    properties:
      apiVersion:
        enum:
        - authproxy.net/v1alpha1
        example: authproxy.net/v1alpha1
        type: string
      kind:
        enum:
        - RateLimit
        example: RateLimit
        type: string
      metadata:
        $ref: '#/definitions/meta.ObjectMeta'
      spec:
        $ref: '#/definitions/openapi.RateLimitSpecJson'
      status:
        $ref: '#/definitions/openapi.RateLimitStatusJson'
    required:
    - apiVersion
    - kind
    - metadata
    - spec
    type: object
  openapi.RateLimitPatchJson:
    description: Kubernetes-style RateLimit patch. Status and server-owned metadata
      are rejected.
    properties:
      apiVersion:
        enum:
        - authproxy.net/v1alpha1
        example: authproxy.net/v1alpha1
        type: string
      kind:
        enum:
        - RateLimit
        example: RateLimit
        type: string
      metadata:
        $ref: '#/definitions/meta.ObjectMetaPatch'
      spec:
        $ref: '#/definitions/openapi.RateLimitSpecPatchJson'
      status:
        $ref: '#/definitions/openapi.RateLimitStatusJson'
    required:
    - apiVersion
    - kind
    - metadata
    - spec
    type: object
  openapi.RateLimitPathMatchJson:
    properties:
      kind:
        enum:
        - prefix
        - glob
        - regex
        type: string
      value:
        type: string
    type: object
  openapi.RateLimitScopeJson:
    properties:
      connectionRef:
        $ref: '#/definitions/openapi.RateLimitConnectionReferenceJson'
      connectorRef:
        $ref: '#/definitions/openapi.RateLimitConnectorReferenceJson'
      namespaceMatcher:
        example: root.acme.payments.**
        type: string
    type: object
  openapi.RateLimitSelectorJson:
    properties:
      labelSelector:
        type: string
      methods:
        items:
          type: string
        type: array
      pathMatch:
        $ref: '#/definitions/openapi.RateLimitPathMatchJson'
      requestTypes:
        items:
          enum:
          - global
          - proxy
          - oauth
          - public
          - probe
          type: string
        type: array
    type: object
  openapi.RateLimitSlidingWindowJson:
    properties:
      limit:
        example: 100
        type: integer
      mode:
        enum:
        - log
        - counter
        type: string
      window:
        example: 1m
        type: string
    type: object
  openapi.RateLimitSpecJson:
    properties:
      algorithm:
        $ref: '#/definitions/openapi.RateLimitAlgorithmJson'
      bucket:
        $ref: '#/definitions/openapi.RateLimitBucketJson'
      mode:
        enum:
        - enforce
        - observe
        type: string
      scope:
        $ref: '#/definitions/openapi.RateLimitScopeJson'
      selector:
        $ref: '#/definitions/openapi.RateLimitSelectorJson'
    required:
    - algorithm
    - bucket
    - selector
    type: object
  openapi.RateLimitSpecPatchJson:
    properties:
      algorithm:
        $ref: '#/definitions/openapi.RateLimitAlgorithmJson'
      bucket:
        $ref: '#/definitions/openapi.RateLimitBucketJson'
      mode:
        enum:
        - enforce
        - observe
        type: string
      scope:
        $ref: '#/definitions/openapi.RateLimitScopeJson'
      selector:
        $ref: '#/definitions/openapi.RateLimitSelectorJson'
    type: object
  openapi.RateLimitStatusJson:
    properties:
      effectiveMode:
        enum:
        - enforce
        - observe
        type: string
    type: object
  openapi.RateLimitTokenBucketJson:
    properties:
      capacity:
        example: 60
        type: integer
      refillRate:
        example: 1
        type: number
    type: object
  routes.ActorJson:
    description: Actor identity within a namespace
    properties:
      annotations:
        additionalProperties:
          type: string
        type: object
      createdAt:
        type: string
      externalId:
        example: user-123
        type: string
      id:
        example: act_test550e8400abcde
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      name:
        example: billing-service
        type: string
      namespace:
        example: root.acme
        type: string
      updatedAt:
        type: string
    type: object
  routes.ConnectionScopesJson:
    properties:
      granted:
        items:
          type: string
        type: array
      requested:
        items:
          type: string
        type: array
    type: object
  routes.ConnectionSetupComplete:
    description: Completion response for connection setup
    properties:
      id:
        description: Connection UUID.
        example: cxn_test550e8400abcde
        type: string
      type:
        description: Response type.
        example: complete
        type: string
    type: object
  routes.ConnectionSetupForm:
    description: Form response for connection setup
    properties:
      data:
        description: |-
          Existing values for fields in this step. Present when reconfiguring a
          configured connection so clients can initialize the form without exposing
          configuration values owned by other setup steps.
        type: object
      id:
        description: Connection UUID.
        example: cxn_test550e8400abcde
        type: string
      jsonSchema:
        description: JSON Schema defining the form fields.
        type: object
      stepDescription:
        description: Step description.
        type: string
      stepId:
        description: Step ID being submitted.
        example: preconnect:0
        type: string
      stepTitle:
        description: Step title.
        example: Choose workspace
        type: string
      type:
        description: Response type.
        example: form
        type: string
      uiSchema:
        description: UI Schema for JSON Forms rendering.
        type: object
    type: object
  routes.ConnectionSetupRedirect:
    description: Redirect response for connection setup
    properties:
      id:
        description: Connection UUID.
        example: cxn_test550e8400abcde
        type: string
      redirectUrl:
        description: URL to redirect the user to.
        example: https://oauth.provider.com/authorize?...
        type: string
      type:
        description: Response type.
        example: redirect
        type: string
    type: object
  routes.ConnectorJson:
    description: Connector API summary response
    properties:
      annotations:
        additionalProperties:
          type: string
        type: object
      createdAt:
        type: string
      description:
        example: Salesforce CRM integration
        type: string
      displayName:
        example: Salesforce
        type: string
      hasConfigure:
        example: false
        type: boolean
      highlight:
        example: CRM platform
        type: string
      id:
        example: cxr_test550e8400abcde
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      logo:
        example: https://example.com/logo.png
        type: string
      name:
        example: salesforce
        type: string
      namespace:
        example: root.acme
        type: string
      state:
        example: primary
        type: string
      statusPageUrl:
        example: https://status.salesforce.com
        type: string
      updatedAt:
        type: string
      version:
        example: 1
        type: integer
    type: object
  routes.CreateActorRequestJson:
    description: Actor creation request
    properties:
      annotations:
        additionalProperties:
          type: string
        type: object
      externalId:
        example: user-123
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      name:
        example: billing-service
        type: string
      namespace:
        example: root.acme
        type: string
    type: object
  routes.DataSourceOptionJson:
    description: Data source option for form select fields
    properties:
      label:
        description: Human-readable label.
        example: My Workspace
        type: string
      value:
        description: Option value.
        example: ws-123
        type: string
    type: object
  routes.ErrorResponse:
    description: Standardized error response
    properties:
      error:
        description: Error message.
        example: Bad Request
        type: string
      stackTrace:
        description: Stack trace, only populated in debug mode.
        type: string
    type: object
  routes.ForceConnectorVersionStateRequestJson:
    description: Request to force a connector version state
    properties:
      state:
        example: primary
        type: string
    type: object
  routes.ForceStateRequestJson:
    description: Request to force a connection state
    properties:
      state:
        example: configured
        type: string
    type: object
  routes.InitiateConnectionRequest:
    description: Request to initiate a connection
    properties:
      connectorId:
        description: ID of the connector to initiate the connection for.
        example: cxr_test550e8400abcde
        type: string
      connectorVersion:
        description: Version of the connector to initiate connection for; if not specified
          defaults to the primary version.
        example: 1
        type: integer
      intoNamespace:
        description: |-
          The namespace to create the connection in. Must be the namespace of connector or a child namespace of that
          namespace. Defaults to the connector namespace if not specified.
        example: root.acme
        type: string
      name:
        description: Optional mutable name for the connection. Defaults to the generated
          connection ID.
        example: production-crm
        type: string
      returnToUrl:
        description: The URL to return to after the connection is completed.
        example: https://example.com/callback
        type: string
    type: object
  routes.KeyValueJson:
    properties:
      key:
        example: env
        type: string
      value:
        example: production
        type: string
    type: object
  routes.MarkNotificationsViewedRequestJson:
    properties:
      ids:
        example:
        - ntf_test550e8400abcde
        items:
          type: string
        type: array
    type: object
  routes.OpenAPIConnectionJson:
    description: Connection to an external service
    properties:
      annotations:
        additionalProperties:
          type: string
        type: object
      connector: {}
      createdAt:
        type: string
      healthState:
        example: healthy
        type: string
      id:
        example: cxn_test550e8400abcde
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      name:
        example: production-crm
        type: string
      namespace:
        example: root.acme
        type: string
      setupError:
        type: string
      setupStepId:
        example: tenant
        type: string
      state:
        example: configured
        type: string
      updatedAt:
        type: string
    type: object
  routes.OpenAPIConnectorLifecycleRequestJson:
    description: Request to run a connector lifecycle operation
    properties:
      timeoutSeconds:
        example: 600
        type: integer
    type: object
  routes.OpenAPIConnectorLifecycleResponseJson:
    description: Response for connector lifecycle operation
    properties:
      connectorId:
        example: cxr_test550e8400abcde
        type: string
      taskId:
        type: string
    type: object
  routes.OpenAPIConnectorVersionJson:
    description: Detailed connector version information
    properties:
      annotations:
        additionalProperties:
          type: string
        type: object
      createdAt:
        type: string
      definition: {}
      id:
        example: cxr_test550e8400abcde
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      name:
        example: salesforce
        type: string
      namespace:
        example: root.acme
        type: string
      state:
        example: primary
        type: string
      updatedAt:
        type: string
      version:
        example: 1
        type: integer
    type: object
  routes.OpenAPICreateConnectorRequestJson:
    description: Request to create a new connector
    properties:
      annotations:
        additionalProperties:
          type: string
        type: object
      definition: {}
      labels:
        additionalProperties:
          type: string
        type: object
      name:
        example: salesforce
        type: string
      namespace:
        example: root.acme
        type: string
    type: object
  routes.OpenAPICreateConnectorVersionRequestJson:
    description: Request to create a new draft connector version
    properties:
      annotations:
        additionalProperties:
          type: string
        type: object
      definition: {}
      labels:
        additionalProperties:
          type: string
        type: object
    type: object
  routes.OpenAPIDisconnectConnectionRequestJson:
    description: Request body for connection disconnect operations
    properties:
      timeoutSeconds:
        example: 600
        type: integer
    type: object
  routes.OpenAPIDisconnectResponseJson:
    description: Response for disconnect operation
    properties:
      connection: {}
      taskId:
        type: string
    type: object
  routes.OpenAPIListActorsResponseJson:
    description: Paginated list of actors
    properties:
      apiVersion:
        enum:
        - authproxy.net/v1alpha1
        example: authproxy.net/v1alpha1
        type: string
      items:
        description: List of actors.
        items:
          $ref: '#/definitions/api.ActorJson'
        type: array
      kind:
        type: string
      metadata:
        $ref: '#/definitions/v1alpha1.ListMeta'
    required:
    - apiVersion
    - items
    - kind
    - metadata
    type: object
  routes.OpenAPIListConnectionResponseJson:
    description: Paginated list of connections
    properties:
      apiVersion:
        enum:
        - authproxy.net/v1alpha1
        example: authproxy.net/v1alpha1
        type: string
      items:
        items:
          $ref: '#/definitions/openapi.ConnectionJson'
        type: array
      kind:
        type: string
      metadata:
        $ref: '#/definitions/v1alpha1.ListMeta'
    required:
    - apiVersion
    - items
