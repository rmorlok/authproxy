labels:
  type: acme-crm
displayName: Acme CRM
logo:
  publicUrl: https://example.com/acme-logo.png
description: |
  Connect to Acme CRM to manage your customer data
auth:
  type: OAuth2
  clientId:
    envVar: ACME_CLIENT_ID
  clientSecret:
    envVar: ACME_CLIENT_SECRET
  authorization:
    endpoint: https://login.acme.com/oauth/authorize
  token:
    endpoint: https://login.acme.com/oauth/token
  scopes:
    - id: read
      reason: Read access to your data
setupFlow:
  preconnect:
    steps:
      - id: tenant
        title: Enter your Acme tenant
        description: Provide your Acme subdomain to connect to your account
        jsonSchema:
          type: object
          required:
            - tenant
          properties:
            tenant:
              type: string
              title: Tenant subdomain
              minLength: 1
        uiSchema:
          type: VerticalLayout
          elements:
            - type: Control
              scope: "#/properties/tenant"
  configure:
    steps:
      - id: select_workspace
        title: Select Workspace
        description: Choose which workspace to sync data from
        jsonSchema:
          type: object
          required:
            - workspace_id
          properties:
            workspace_id:
              type: string
              title: Workspace
              x-data-source: workspaces
        uiSchema:
          type: VerticalLayout
          elements:
            - type: Control
              scope: "#/properties/workspace_id"
        dataSources:
          workspaces:
            proxyRequest:
              method: GET
              url: https://api.acme.com/v1/workspaces
            transform: "data.map(w => ({ value: w.id, label: w.name }))"
      - id: sync_options
        title: Sync Options
        if:
          javascript: |
            cfg.region === "eu" && labels["apxy/cxr/type"] === "acme-crm"
        jsonSchema:
          type: object
          properties:
            sync_frequency:
              type: string
              title: Sync frequency
              enum:
                - hourly
                - daily
                - weekly
        uiSchema:
          type: VerticalLayout
          elements:
            - type: Control
              scope: "#/properties/sync_frequency"
