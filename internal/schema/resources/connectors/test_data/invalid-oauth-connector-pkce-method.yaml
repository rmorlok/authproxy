labels:
  type: asana
displayName: Asana (bad PKCE)
logo:
  publicUrl: https://upload.wikimedia.org/wikipedia/commons/thumb/3/3b/Asana_logo.svg/2880px-Asana_logo.svg.png
description: |
  PKCE block with an unsupported method — must be rejected by the schema.
auth:
  type: OAuth2
  clientId:
    envVar: ASANA_CLIENT_ID
  clientSecret:
    envVar: ASANA_CLIENT_SECRET
  authorization:
    endpoint: https://app.asana.com/-/oauth_authorize
    pkce:
      method: bogus
  token:
    endpoint: https://app.asana.com/-/oauth_token
  scopes:
    - id: projects:read
      reason: |
        We need access to see the projects
