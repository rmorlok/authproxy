connectors:
  autoMigrationLockDuration: 30s
  loadFromList:
  - apiVersion: authproxy.net/v1alpha1
    kind: Connector
    metadata:
      name: asana
      id: cxr_d21753f82e9143e7
      generation: 1
      labels:
        type: asana
    spec:
      definition:
        displayName: Asana
        logo:
          publicUrl: https://upload.wikimedia.org/wikipedia/commons/thumb/3/3b/Asana_logo.svg/2880px-Asana_logo.svg.png
        description: 'Allow our agent organize your work

'
        auth:
          type: OAuth2
          clientId:
            envVar: ASANA_CLIENT_ID
          clientSecret:
            envVar: ASANA_CLIENT_SECRET
          authorization:
            endpoint: https://app.asana.com/-/oauth_authorize
          token:
            endpoint: https://app.asana.com/-/oauth_token
          scopes:
          - id: projects:read
            reason: 'We need access to see the projects

'
          - id: tasks:read
            reason: 'Allows us to give information about open tasks

'
          - id: users:read
            reason: 'Allows us to map work to who is responsible

'
