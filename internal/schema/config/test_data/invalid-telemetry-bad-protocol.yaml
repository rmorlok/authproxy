api:
  port: 8081
adminApi:
  port: 8082
public:
  port: 8081
worker:
  healthCheckPort: 8083
hostApplication:
  initiateSessionUrl: http://127.0.0.1:8888/login-redirect
systemAuth:
  jwtSigningKey:
    publicKey:
      path: ./dev_config/keys/system.pub
    privateKey:
      path: ./dev_config/keys/system
database:
  provider: postgres
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  database: authproxy
  sslmode: disable
connectors:
  loadFromList: []
telemetry:
  enabled: true
  exporter:
    protocol: not-a-real-protocol
