public:
  port: bad
  cookie:
    sameSite: none
  tls:
    autoGenPath: "./dev_config/keys/tls/"
api:
  port: 8081
adminApi:
  port: 8082
  ui:
    enabled: true
    baseUrl: http://localhost:5174
    initiateSessionUrl: http://127.0.0.1:8888/login-redirect
  cookie:
    sameSite: none
  tls:
    autoGenPath: "./dev_config/keys/tls/"
worker:
  healthCheckPort:
    envVar: HEALTH_CHECK_PORT
    default: 8083
hostApplication:
  initiateSessionUrl: http://127.0.0.1:8888/login-redirect
marketplace:
  baseUrl: http://localhost:5173
systemAuth:
  jwtSigningKey:
    publicKey:
      path: "./dev_config/keys/system.pub"
    privateKey:
      path: "./dev_config/keys/system"
  actors:
    root:
      keysPath: "./dev_config/keys/admin"
  globalAesKey:
    envVarBase64: GLOBAL_AES_KEY
errorPages:
  internalError: https://example.com
database:
  provider: sqlite
  autoMigrationLockDuration: 30s
  path: "./tmp/dev.db"
logging:
  type: tint
  level: debug
appMetrics:
  resourceSnapshotInterval: 15m
  requestEvents:
    fullRequestRecording: always
  database:
    provider: sqlite
    path: "./tmp/app_metrics.db"
redis:
  provider: redis
  address: localhost:6379
oauth:
  roundTripTtl: 60m
