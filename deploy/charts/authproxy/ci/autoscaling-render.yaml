# Render-only values used by helm-chart-ci to exercise KEDA worker scaling.

autoscaling:
  enabled: false

keda:
  enabled: false

queueAutoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  pollingInterval: 15
  cooldownPeriod: 300
  prometheus:
    serverAddress: http://prometheus.monitoring.svc:9090
    query: 'max(authproxy_asynq_queue_size{messaging_destination_name="default"})'
    threshold: "100"
    activationThreshold: "1"
  cpu:
    enabled: true
    targetUtilizationPercentage: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
