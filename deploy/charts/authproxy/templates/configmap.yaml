{{/*
Render the AuthProxy config YAML from typed values, layered with the free-
form `config` overlay. Sensitive fields reference env vars via the
AuthProxy StringValue { envVar: NAME } pattern so passwords stay in
Secrets, not in this ConfigMap.
*/}}
{{- $cfg := dict -}}

{{/* --- service ports --- */}}
{{- if .Values.services.public.enabled -}}
{{- $public := dict "port" .Values.ports.public -}}
{{- if .Values.services.public.baseUrl -}}
{{-   $_ := set $public "baseUrl" (tpl .Values.services.public.baseUrl $) -}}
{{- end -}}
{{- if .Values.services.public.enableProxy -}}
{{-   $_ := set $public "enableProxy" true -}}
{{- end -}}
{{- if .Values.services.public.static.enabled -}}
{{-   $static := dict -}}
{{-   if .Values.services.public.static.mountAt -}}
{{-     $_ := set $static "mountAt" .Values.services.public.static.mountAt -}}
{{-   end -}}
{{-   if .Values.services.public.static.serveFrom -}}
{{-     $_ := set $static "serveFrom" (tpl .Values.services.public.static.serveFrom $) -}}
{{-   end -}}
{{-   $_ := set $public "static" $static -}}
{{- end -}}
{{- $_ := set $cfg "public" $public -}}
{{- end -}}
{{- if .Values.services.api.enabled -}}
{{- $_ := set $cfg "api" (dict "port" .Values.ports.api) -}}
{{- end -}}
{{- if .Values.services.adminApi.enabled -}}
{{- $adminApi := dict "port" .Values.ports.adminApi -}}
{{- if .Values.services.adminApi.ui.enabled -}}
{{-   $ui := dict "enabled" true -}}
{{-   if .Values.services.adminApi.ui.baseUrl -}}
{{-     $_ := set $ui "baseUrl" (tpl .Values.services.adminApi.ui.baseUrl $) -}}
{{-   end -}}
{{-   if .Values.services.adminApi.ui.initiateSessionUrl -}}
{{-     $_ := set $ui "initiateSessionUrl" (tpl .Values.services.adminApi.ui.initiateSessionUrl $) -}}
{{-   end -}}
{{-   $_ := set $adminApi "ui" $ui -}}
{{- end -}}
{{- if .Values.services.adminApi.static.enabled -}}
{{-   $static := dict -}}
{{-   if .Values.services.adminApi.static.mountAt -}}
{{-     $_ := set $static "mountAt" .Values.services.adminApi.static.mountAt -}}
{{-   end -}}
{{-   if .Values.services.adminApi.static.serveFrom -}}
{{-     $_ := set $static "serveFrom" (tpl .Values.services.adminApi.static.serveFrom $) -}}
{{-   end -}}
{{-   $_ := set $adminApi "static" $static -}}
{{- end -}}
{{- $_ := set $cfg "adminApi" $adminApi -}}
{{- end -}}
{{- if .Values.services.worker.enabled -}}
{{- $worker := dict "healthCheckPort" .Values.ports.workerHealth -}}
{{- if .Values.worker.workflowPollers -}}
{{-   $_ := set $worker "workflowPollers" .Values.worker.workflowPollers -}}
{{- end -}}
{{- if .Values.worker.activityPollers -}}
{{-   $_ := set $worker "activityPollers" .Values.worker.activityPollers -}}
{{- end -}}
{{- if .Values.worker.maxParallelWorkflowTasks -}}
{{-   $_ := set $worker "maxParallelWorkflowTasks" .Values.worker.maxParallelWorkflowTasks -}}
{{- end -}}
{{- if .Values.worker.maxParallelActivityTasks -}}
{{-   $_ := set $worker "maxParallelActivityTasks" .Values.worker.maxParallelActivityTasks -}}
{{- end -}}
{{- if .Values.worker.workflowHeartbeatInterval -}}
{{-   $_ := set $worker "workflowHeartbeatInterval" .Values.worker.workflowHeartbeatInterval -}}
{{- end -}}
{{- $_ := set $cfg "worker" $worker -}}
{{- end -}}

{{/*
String fields below run through `tpl` so an umbrella chart can pass
values like `"{{ .Release.Name }}-postgresql"` and have them expand
at this chart's render time. Customers passing plain literal values
see no behavior change — tpl is a no-op on strings with no
template syntax.
*/}}

{{/* --- database --- */}}
{{- $db := dict "provider" .Values.database.provider -}}
{{- if eq .Values.database.provider "postgres" -}}
{{-   $_ := set $db "host" (tpl .Values.database.host $) -}}
{{-   $_ := set $db "port" .Values.database.port -}}
{{-   $_ := set $db "user" (tpl .Values.database.user $) -}}
{{-   $_ := set $db "database" (tpl .Values.database.database $) -}}
{{-   $_ := set $db "sslmode" .Values.database.sslmode -}}
{{-   if .Values.database.existingSecret -}}
{{-     $_ := set $db "password" (dict "envVar" "AUTHPROXY_DB_PASSWORD") -}}
{{-   end -}}
{{- else if eq .Values.database.provider "sqlite" -}}
{{-   $_ := set $db "path" .Values.database.path -}}
{{- end -}}
{{- $_ := set $cfg "database" $db -}}

{{/* --- redis --- */}}
{{- $redisProvider := default "redis" .Values.redis.provider -}}
{{- $redis := dict "provider" $redisProvider -}}
{{- if eq $redisProvider "redis" -}}
{{-   $_ := set $redis "address" (tpl .Values.redis.address $) -}}
{{-   $_ := set $redis "db" .Values.redis.db -}}
{{-   if .Values.redis.username -}}
{{-     $_ := set $redis "username" (tpl .Values.redis.username $) -}}
{{-   end -}}
{{-   if .Values.redis.existingSecret -}}
{{-     $_ := set $redis "password" (dict "envVar" "AUTHPROXY_REDIS_PASSWORD") -}}
{{-   end -}}
{{- end -}}
{{- $_ := set $cfg "redis" $redis -}}

{{/* --- host application (required by validator) --- */}}
{{- if .Values.hostApplication.initiateSessionUrl -}}
{{-   $_ := set $cfg "hostApplication" (dict "initiateSessionUrl" (tpl .Values.hostApplication.initiateSessionUrl $)) -}}
{{- end -}}

{{/* --- connectors block (required by validator; empty list is acceptable) --- */}}
{{- $connectors := dict "loadFromList" .Values.connectors.loadFromList -}}
{{- $_ := set $cfg "connectors" $connectors -}}

{{/* --- appMetrics (server unconditionally wires up the metrics store) --- */}}
{{/*
  Server-side this used to be `httpLogging`; renamed to `appMetrics`
  with the request-event capture moved under a `requestEvents`
  sub-block. See internal/schema/config/app_metrics.go.
*/}}
{{- $metricsDb := dict -}}
{{- if .Values.appMetrics.shareMainDatabase -}}
{{-   $metricsDb = $db -}}
{{- else -}}
{{-   $metricsDb = .Values.appMetrics.database -}}
{{- end -}}
{{/* --- request-log blob storage --- */}}
{{- $blobStorage := dict -}}
{{- $blobProvider := default "" .Values.blobStorage.provider -}}
{{- if eq $blobProvider "filesystem" -}}
{{-   $blobStorage = dict "provider" "filesystem" "path" .Values.blobStorage.filesystem.path -}}
{{- else if eq $blobProvider "memory" -}}
{{-   $blobStorage = dict "provider" "memory" -}}
{{- else if .Values.s3.enabled -}}
{{-   $s3 := dict "provider" "s3" "bucket" .Values.s3.bucket "forcePathStyle" .Values.s3.forcePathStyle -}}
{{-   if .Values.s3.region -}}{{- $_ := set $s3 "region" .Values.s3.region -}}{{- end -}}
{{-   if .Values.s3.endpoint -}}{{- $_ := set $s3 "endpoint" .Values.s3.endpoint -}}{{- end -}}
{{-   if .Values.s3.prefix -}}{{- $_ := set $s3 "prefix" .Values.s3.prefix -}}{{- end -}}
{{-   $creds := dict "type" "implicit" -}}
{{-   $_ := set $s3 "credentials" $creds -}}
{{-   $blobStorage = $s3 -}}
{{- end -}}

{{- $appMetrics := dict
      "database" $metricsDb
      "requestEvents" (dict
        "fullRequestRecording" .Values.appMetrics.fullRequestRecording) -}}
{{- if $blobStorage -}}
{{-   $_ := set $appMetrics "blobStorage" $blobStorage -}}
{{- end -}}
{{- $_ := set $cfg "appMetrics" $appMetrics -}}

{{/* --- crypto material file paths --- */}}
{{- if .Values.jwt.existingSecret -}}
{{-   $sysAuth := dict "jwtSigningKey" (dict
        "publicKey" (dict "path" (printf "%s/%s" .Values.jwt.mountPath .Values.jwt.publicKeyFile))
        "privateKey" (dict "path" (printf "%s/%s" .Values.jwt.mountPath .Values.jwt.privateKeyFile))) -}}
{{-   if .Values.encryptionKeys.existingSecret -}}
{{-     $_ := set $sysAuth "globalAesKey" (dict "path" (printf "%s/%s" .Values.encryptionKeys.mountPath .Values.encryptionKeys.globalAesKeyFile)) -}}
{{-   end -}}
{{-   if .Values.actors.existingSecret -}}
{{-     $actorSource := dict "keysPath" .Values.actors.mountPath -}}
{{-     if .Values.actors.permissions -}}
{{-       $_ := set $actorSource "permissions" .Values.actors.permissions -}}
{{-     end -}}
{{-     $actors := dict "root" $actorSource -}}
{{-     $_ := set $sysAuth "actors" $actors -}}
{{-   end -}}
{{-   $_ := set $cfg "systemAuth" $sysAuth -}}
{{- end -}}

{{/* --- overlay: merge user-provided `config` over the rendered defaults --- */}}
{{- $cfg = mergeOverwrite $cfg .Values.config -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "authproxy.fullname" . }}-config
  labels:
    {{- include "authproxy.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- toYaml $cfg | nindent 4 }}
