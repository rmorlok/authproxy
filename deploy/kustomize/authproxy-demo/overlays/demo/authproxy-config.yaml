public:
  port: 8080
  baseUrl: https://marketplace.demo.authproxy.net
  enableProxy: true
  static: {}
api:
  port: 8081
adminApi:
  port: 8082
  ui:
    enabled: true
    baseUrl: https://admin.demo.authproxy.net
    initiateSessionUrl: https://demo.authproxy.net/
  static: {}
worker:
  healthCheckPort: 8083
database:
  provider: postgres
  autoMigrate: true
  host: demo-postgresql
  port: 5432
  user: authproxy
  database: authproxy
  sslmode: disable
  password:
    envVar: AUTHPROXY_DB_PASSWORD
redis:
  provider: redis
  address: demo-redis-master:6379
  db: 0
  password:
    envVar: AUTHPROXY_REDIS_PASSWORD
hostApplication:
  initiateSessionUrl: https://demo.authproxy.net/
connectors:
  autoMigrate: true
  loadFromList: []
appMetrics:
  autoMigrate: true
  database:
    provider: sqlite
    path: /tmp/authproxy-app-metrics.db
  blobStorage:
    provider: s3
    endpoint: http://demo-minio:9000
    region: us-east-1
    bucket: authproxy-request-logs
    credentials:
      type: access_key
      accessKeyId: authproxy
      secretAccessKey:
        envVar: MINIO_ROOT_PASSWORD
    forcePathStyle: true
  requestEvents:
    fullRequestRecording: never
telemetry:
  enabled: true
  exporter:
    protocol: grpc
    endpoint: http://demo-otel-lgtm:4317
    insecure: true
  resource:
    serviceNamePrefix: authproxy-demo
    attributes:
      deployment.environment: demo
  sampling:
    ratio: 1.0
  signals:
    traces: true
    metrics: true
    logs: true
  http:
    excludedPaths:
      - /ping
      - /healthz
  proxy:
    spanAttributeLabels:
      - type
      - demo
    metricDimensionLabels:
      - type
      - demo
    metricDimensionValueCap: 50
systemAuth:
  jwtSigningKey:
    publicKey:
      path: /etc/authproxy/keys/jwt/system.pub
    privateKey:
      path: /etc/authproxy/keys/jwt/system
  globalAesKey:
    path: /etc/authproxy/keys/encryption/global_aes.key
  actors:
    keysPath: /etc/authproxy/keys/actors
    permissions:
      - namespace: root.**
        resources:
          - "*"
        verbs:
          - "*"
