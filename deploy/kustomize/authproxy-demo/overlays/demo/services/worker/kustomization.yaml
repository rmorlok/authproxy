# Worker service: Asynq background tasks; only its health endpoint listens.
#
# Instantiates the shared AuthProxy workload template as a single-service
# Deployment so it can be scaled and resource-limited on its own. Resource
# requests/limits live in ../../resource-limits.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../workload/authproxy

nameSuffix: -worker

# Replaces the template's "authproxy" component in labels and selectors so each
# service's Deployment and Service select only their own pods.
labels:
  - pairs:
      app.kubernetes.io/component: worker
    includeSelectors: true

patches:
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - serve
          - --config=/etc/authproxy/config.yaml
          - worker
      - op: replace
        path: /spec/template/spec/containers/0/ports
        value:
          - name: worker-health
            containerPort: 8083
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/httpGet/port
        value: worker-health
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/port
        value: worker-health
  # Nothing calls the worker, so it needs no Service; kubelet probes the pod
  # directly.
  - target:
      kind: Service
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: authproxy
