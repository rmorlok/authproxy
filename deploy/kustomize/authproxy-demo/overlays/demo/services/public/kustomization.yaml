# Public service: OAuth callbacks and the marketplace UI (marketplace.<host>).
#
# Instantiates the shared AuthProxy workload template as a single-service
# Deployment so it can be scaled and resource-limited on its own. Resource
# requests/limits live in ../../resource-limits.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../workload/authproxy

nameSuffix: -public

# Replaces the template's "authproxy" component in labels and selectors so each
# service's Deployment and Service select only their own pods.
labels:
  - pairs:
      app.kubernetes.io/component: public
    includeSelectors: true

patches:
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - serve
          - --config=/etc/authproxy/config.yaml
          - public
      - op: replace
        path: /spec/template/spec/containers/0/ports
        value:
          - name: public
            containerPort: 8080
      - op: replace
        path: /spec/template/spec/containers/0/startupProbe/httpGet/port
        value: public
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/httpGet/port
        value: public
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/port
        value: public
  - target:
      kind: Service
    patch: |-
      - op: replace
        path: /spec/ports
        value:
          - name: public
            port: 8080
            targetPort: public
