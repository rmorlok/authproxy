apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo
namePrefix: demo-

resources:
  - ../../base
  # One Deployment per AuthProxy service so each can be scaled, limited, and
  # observed independently.
  - services/public
  - services/api
  - services/admin-api
  - services/worker
  - clickhouse.yaml
  - grafana.yaml
  - ingress.yaml
  - otel-lgtm.yaml
  - postgres.yaml
  - redis.yaml
  - seaweedfs.yaml

configMapGenerator:
  - name: authproxy-config
    files:
      - config.yaml=authproxy-config.yaml
  - name: grafana-dashboards
    files:
      - authproxy-app-metrics.json=dashboards/authproxy-app-metrics.json

generatorOptions:
  disableNameSuffixHash: true

images:
  - name: ghcr.io/rmorlok/authproxy
    newTag: main
  - name: ghcr.io/rmorlok/authproxy-demo-shell
    newTag: main
  - name: ghcr.io/rmorlok/authproxy-demo-grafana
    newTag: main

patches:
  # Applied to all four per-service AuthProxy Deployments.
  - path: authproxy-secrets.yaml
    target:
      kind: Deployment
      labelSelector: app.kubernetes.io/name=authproxy
  - path: authproxy-migrate-secrets.yaml
  - path: demo-shell-env.yaml
  - path: resource-limits.yaml
