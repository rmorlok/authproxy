apiVersion: apps/v1
kind: Deployment
metadata:
  name: authproxy
spec:
  template:
    spec:
      containers:
        - name: authproxy
          env:
            # S3 secret key for the demo SeaweedFS blob store; see seaweedfs.yaml.
            - name: SEAWEEDFS_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: demo-seaweedfs-creds
                  key: secret-key
          envFrom:
            - secretRef:
                name: demo-db
                optional: true
            - secretRef:
                name: demo-redis-creds
                optional: true
          volumeMounts:
            - mountPath: /etc/authproxy/keys/actors
              $patch: delete
            - name: actors-keys
              mountPath: /etc/authproxy/keys/actors/root
      volumes:
        - name: jwt-keys
          secret:
            secretName: demo-jwt
        - name: encryption-keys
          secret:
            secretName: demo-encryption
        - name: actors-keys
          secret:
            secretName: demo-actors
---
apiVersion: batch/v1
kind: Job
metadata:
  name: authproxy-migrate
spec:
  template:
    spec:
      containers:
        - name: migrate
          envFrom:
            - secretRef:
                name: demo-db
                optional: true
            - secretRef:
                name: demo-redis-creds
                optional: true
          volumeMounts:
            - mountPath: /etc/authproxy/keys/actors
              $patch: delete
            - name: actors-keys
              mountPath: /etc/authproxy/keys/actors/root
      volumes:
        - name: jwt-keys
          secret:
            secretName: demo-jwt
        - name: encryption-keys
          secret:
            secretName: demo-encryption
        - name: actors-keys
          secret:
            secretName: demo-actors
