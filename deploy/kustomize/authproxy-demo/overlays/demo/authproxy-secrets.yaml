apiVersion: apps/v1
kind: Deployment
metadata:
  name: authproxy
spec:
  template:
    spec:
      containers:
        - name: authproxy
          env:
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: demo-minio-creds
                  key: root-password
          envFrom:
            - secretRef:
                name: demo-db
                optional: true
            - secretRef:
                name: demo-redis-creds
                optional: true
            - secretRef:
                name: demo-minio-creds
                optional: true
          volumeMounts:
            - mountPath: /etc/authproxy/keys/actors
              $patch: delete
            - name: actors-keys
              mountPath: /etc/authproxy/keys/actors/root
            - name: smoke-actors-keys
              mountPath: /etc/authproxy/keys/actors/smoke
              readOnly: true
      volumes:
        - name: jwt-keys
          secret:
            secretName: demo-jwt
        - name: encryption-keys
          secret:
            secretName: demo-encryption
        - name: actors-keys
          secret:
            secretName: demo-actors
        - name: smoke-actors-keys
          secret:
            secretName: demo-smoke-actors
---
apiVersion: batch/v1
kind: Job
metadata:
  name: authproxy-migrate
spec:
  template:
    spec:
      containers:
        - name: migrate
          envFrom:
            - secretRef:
                name: demo-db
                optional: true
            - secretRef:
                name: demo-redis-creds
                optional: true
            - secretRef:
                name: demo-minio-creds
                optional: true
          volumeMounts:
            - mountPath: /etc/authproxy/keys/actors
              $patch: delete
            - name: actors-keys
              mountPath: /etc/authproxy/keys/actors/root
            - name: smoke-actors-keys
              mountPath: /etc/authproxy/keys/actors/smoke
              readOnly: true
      volumes:
        - name: jwt-keys
          secret:
            secretName: demo-jwt
        - name: encryption-keys
          secret:
            secretName: demo-encryption
        - name: actors-keys
          secret:
            secretName: demo-actors
        - name: smoke-actors-keys
          secret:
            secretName: demo-smoke-actors
