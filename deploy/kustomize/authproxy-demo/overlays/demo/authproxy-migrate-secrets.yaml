# Wires demo Secrets into the migration Job. `migrate all` also creates the
# ClickHouse app-metrics schema, so it needs the ClickHouse password.
apiVersion: batch/v1
kind: Job
metadata:
  name: authproxy-migrate
spec:
  template:
    spec:
      containers:
        - name: migrate
          envFrom:
            - secretRef:
                name: demo-db
                optional: true
            - secretRef:
                name: demo-redis-creds
                optional: true
            - secretRef:
                name: demo-clickhouse-creds
          volumeMounts:
            - mountPath: /etc/authproxy/keys/actors
              $patch: delete
            - name: actors-keys
              mountPath: /etc/authproxy/keys/actors/root
      volumes:
        - name: jwt-keys
          secret:
            secretName: demo-jwt
        - name: encryption-keys
          secret:
            secretName: demo-encryption
        - name: actors-keys
          secret:
            secretName: demo-actors
