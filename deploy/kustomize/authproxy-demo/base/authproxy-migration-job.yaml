apiVersion: batch/v1
kind: Job
metadata:
  name: authproxy-migrate
  labels:
    app.kubernetes.io/name: authproxy
    app.kubernetes.io/component: migration
spec:
  suspend: true
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authproxy
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: authproxy
      containers:
        - name: migrate
          image: ghcr.io/rmorlok/authproxy:main
          imagePullPolicy: Always
          args:
            - migrate
            - --config=/etc/authproxy/config.yaml
            - all
          envFrom:
            - secretRef:
                name: db
                optional: true
            - secretRef:
                name: redis-creds
                optional: true
            - secretRef:
                name: minio-creds
                optional: true
          volumeMounts:
            - name: config
              mountPath: /etc/authproxy/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: jwt-keys
              mountPath: /etc/authproxy/keys/jwt
              readOnly: true
            - name: encryption-keys
              mountPath: /etc/authproxy/keys/encryption
              readOnly: true
            - name: actors-keys
              mountPath: /etc/authproxy/keys/actors
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: authproxy-config
        - name: jwt-keys
          secret:
            secretName: authproxy-jwt-placeholder
        - name: encryption-keys
          secret:
            secretName: authproxy-encryption-placeholder
        - name: actors-keys
          secret:
            secretName: authproxy-actors-placeholder
