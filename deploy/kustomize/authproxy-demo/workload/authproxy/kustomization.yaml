# Reusable AuthProxy Deployment + Service. Overlays include this directory
# directly (dev) or once per service with a name suffix (demo); see
# overlays/demo/services/.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - authproxy.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: authproxy-demo
