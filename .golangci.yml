version: "2"

linters:
  default: none
  enable:
    - depguard
  settings:
    depguard:
      rules:
        pkg-errors:
          deny:
            - pkg: "github.com/pkg/errors"
              desc: "Use fmt.Errorf(\"...: %w\", err) or standard errors package instead"
  exclusions:
    generated: lax
