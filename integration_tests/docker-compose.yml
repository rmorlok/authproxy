# Docker Compose for integration tests.
# Uses non-default ports to avoid conflicts with local development services.
#
# Usage:
#   cd integration_tests && docker compose up -d
#   go test -tags integration -v ./...
#   docker compose down -v

services:
  postgres:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: authproxy_integration
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:latest
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8124:8123"
    environment:
      CLICKHOUSE_DB: authproxy
      CLICKHOUSE_USER: authproxy
      CLICKHOUSE_PASSWORD: authproxy
    tmpfs:
      - /var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10

  seaweedfs:
    # Pin the multi-architecture index for identical CI and local S3 behavior.
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    ports:
      - "127.0.0.1:${AUTHPROXY_TEST_S3_PORT:-9003}:8333"
    volumes:
      - ./config/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    tmpfs:
      - /data
    command:
      - mini
      - -dir=/data
      - -s3.config=/etc/seaweedfs/s3.json
      - -bucket=authproxy-request-logs,authproxy-streaming-test
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -webdav=false
      - -admin.ui=false
      - -master.telemetry=false
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8333/readyz"]
      interval: 3s
      timeout: 3s
      retries: 30

  vault:
    image: hashicorp/vault:1.20.4
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-only-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      # Dev mode does not need mlock (and mlock via CAP_IPC_LOCK requires
      # CAP_SETFCAP to install at runtime). Skip setcap so the entrypoint
      # runs cleanly without extra privileges.
      SKIP_SETCAP: "true"
    command: server -dev
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 3s
      timeout: 3s
      retries: 10

  # OAuth test provider (rmorlok/go-oauth2-server, --test-mode).
  #
  # Run with the test-mode control plane enabled: the server uses an embedded
  # in-memory SQLite DB, skips remote config, and exposes /test/* control-plane
  # endpoints for registering clients, users, scripting responses, and driving
  # authorize programmatically. See:
  #   https://github.com/rmorlok/go-oauth2-server/blob/main/docs/test_mode_api.md
  oauth-server:
    build:
      context: https://github.com/rmorlok/go-oauth2-server.git#eb379d97292dc292f55d70fd58198efb51489828
    ports:
      - "8086:8080"
    # Bypass the upstream docker-entrypoint.sh: it waits for postgres+etcd
    # before invoking the binary, which test-mode does not need (it uses an
    # embedded SQLite DB and skips the remote-config backend).
    entrypoint: ["go-oauth2-server"]
    command: ["runserver", "--test-mode", "--test-port", "8080"]
    # The upstream bookworm-slim runtime image has no wget/curl/python/nc, so
    # an in-container healthcheck would need extra packages. Skip it — the
    # OAuth2TestProvider helper polls /test/health from the host before the
    # first request, and CI does the same after `docker compose up -d`.
