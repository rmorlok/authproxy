# Integration test configuration.
# Points at Docker services started by ../docker-compose.yml with non-default ports.
# Keys are loaded from dev_config/keys/ (relative to repo root).

public:
  port: 0  # random port

api:
  port: 0  # random port

adminApi:
  port: 0  # random port

worker:
  healthCheckPort: 0
  cronSyncInterval: 1m

tasks:
  defaultRetention: 24h

hostApplication:
  initiateSessionUrl: http://127.0.0.1:8888/login-redirect

marketplace:
  baseUrl: http://localhost:5173

systemAuth:
  jwtSigningKey:
    publicKey:
      path: ./dev_config/keys/system.pub
    privateKey:
      path: ./dev_config/keys/system
  actors:
    keysPath: ./dev_config/keys/admin
    permissions:
      - namespace: root.**
        resources:
          - "*"
        verbs:
          - "*"
  globalAesKey:
    path: ./dev_config/keys/global_aes.key

errorPages:
  internalError: https://example.com/500.html

database:
  provider: postgres
  host: localhost
  port: 5433
  user: postgres
  password: postgres
  database: authproxy_integration
  sslmode: disable

logging:
  type: tint
  level: warn

appMetrics:
  resourceSnapshotInterval: 15m
  requestEvents:
    fullRequestRecording: always
  database:
    provider: clickhouse
    user: authproxy
    password: authproxy
    addresses:
      - localhost:8124
    database: authproxy
  blobStorage:
    provider: s3
    endpoint: http://localhost:9003
    region: us-east-1
    bucket: authproxy-request-logs
    credentials:
      type: access_key
      accessKeyId: minioadmin
      secretAccessKey: minioadmin
    forcePathStyle: true
    prefix: "integration-test/"

redis:
  provider: redis
  address: localhost:6380

oauth:
  roundTripTtl: 60m

connectors:
  autoMigrationLockDuration: 30s
  loadFromList: []
