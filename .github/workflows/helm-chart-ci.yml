# schema: https://json.schemastore.org/github-workflow.json
name: Helm Chart CI

on:
  push:
    branches: [main]
    paths:
      - 'deploy/charts/**'
      - 'deploy/kustomize/**'
      - '.github/workflows/helm-chart-ci.yml'
      - '.github/ct.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'deploy/charts/**'
      - 'deploy/kustomize/**'
      - '.github/workflows/helm-chart-ci.yml'
      - '.github/ct.yaml'

permissions:
  contents: read

concurrency:
  group: helm-chart-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.6.1

      - name: List changed charts
        id: changed
        run: |
          changed=$(ct list-changed --config .github/ct.yaml --target-branch main)
          if [ -n "$changed" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Changed charts:"
            echo "$changed"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No chart changes detected."
          fi

      - name: Register Helm repos for chart dependencies
        # `ct lint` runs `helm dependency build` internally, which only
        # resolves dependencies whose `repository:` URL is registered as
        # a named helm repo on this runner. Pre-register every external
        # repo across all charts in this monorepo. Idempotent — `helm
        # repo add` is a no-op when the alias already exists with the
        # same URL.
        if: steps.changed.outputs.found == 'true'
        run: |
          # bootstrap chart
          helm repo add ingress-nginx  https://kubernetes.github.io/ingress-nginx
          helm repo add jetstack       https://charts.jetstack.io
          helm repo add external-dns   https://kubernetes-sigs.github.io/external-dns/
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/
          helm repo add kedacore       https://kedacore.github.io/charts
          helm repo update

      - name: ct lint
        if: steps.changed.outputs.found == 'true'
        run: ct lint --config .github/ct.yaml --target-branch main

      - name: Verify AuthProxy autoscaling renders
        if: steps.changed.outputs.found == 'true'
        run: |
          set -euo pipefail

          disabled_manifest="$(mktemp)"
          keda_controller_manifest="$(mktemp)"
          native_hpa_manifest="$(mktemp)"
          keda_manifest="$(mktemp)"

          helm template authproxy deploy/charts/authproxy \
            -f deploy/charts/authproxy/ci/postgres-redis-values.yaml \
            >"${disabled_manifest}"
          if grep -q "kind: HorizontalPodAutoscaler" "${disabled_manifest}"; then
            echo "HPA rendered even though autoscaling.enabled is false" >&2
            exit 1
          fi
          if grep -q "name: keda-operator" "${disabled_manifest}"; then
            echo "KEDA rendered even though keda.enabled is false" >&2
            exit 1
          fi
          grep -q "name: authproxy-migrate-1" "${disabled_manifest}"
          grep -q -- "- migrate" "${disabled_manifest}"
          grep -q -- "- all" "${disabled_manifest}"
          if grep -q "autoMigrate" "${disabled_manifest}"; then
            echo "Removed autoMigrate configuration rendered by Helm" >&2
            exit 1
          fi

          helm template authproxy deploy/charts/authproxy \
            -f deploy/charts/authproxy/ci/postgres-redis-values.yaml \
            --set keda.enabled=true \
            >"${keda_controller_manifest}"
          grep -q "kind: CustomResourceDefinition" "${keda_controller_manifest}"
          grep -q "name: scaledobjects.keda.sh" "${keda_controller_manifest}"
          grep -q "kind: Deployment" "${keda_controller_manifest}"
          grep -q "name: keda-operator" "${keda_controller_manifest}"

          helm template authproxy deploy/charts/authproxy \
            -f deploy/charts/authproxy/ci/postgres-redis-values.yaml \
            --set keda.enabled=false \
            --set autoscaling.enabled=true \
            --set autoscaling.minReplicas=2 \
            --set autoscaling.maxReplicas=8 \
            >"${native_hpa_manifest}"
          grep -q "apiVersion: autoscaling/v2" "${native_hpa_manifest}"
          grep -q "kind: HorizontalPodAutoscaler" "${native_hpa_manifest}"

          helm template authproxy deploy/charts/authproxy \
            -f deploy/charts/authproxy/ci/postgres-redis-values.yaml \
            -f deploy/charts/authproxy/ci/autoscaling-render.yaml \
            >"${keda_manifest}"
          grep -q "apiVersion: keda.sh/v1alpha1" "${keda_manifest}"
          grep -q "kind: ScaledObject" "${keda_manifest}"
          grep -q "name: authproxy-queue" "${keda_manifest}"
          grep -q 'serverAddress: "http://prometheus.monitoring.svc:9090"' "${keda_manifest}"
          grep -q 'query: "max(authproxy_asynq_queue_size{messaging_destination_name=\\\"default\\\"})"' "${keda_manifest}"

          if grep -q "kind: HorizontalPodAutoscaler" "${keda_manifest}"; then
            echo "built-in HPA rendered together with a KEDA ScaledObject" >&2
            exit 1
          fi

          for manifest in "${native_hpa_manifest}" "${keda_manifest}"; do
            if awk '
              /^kind: Deployment$/ { in_deployment=1; next }
              /^---$/ { in_deployment=0 }
              in_deployment && /^[[:space:]]+replicas:/ { found=1 }
              END { exit found ? 0 : 1 }
            ' "${manifest}"; then
              echo "an autoscaled Deployment rendered a fixed replicas value" >&2
              exit 1
            fi
          done

      - name: Verify Kustomize demo/dev renders
        run: |
          set -euo pipefail
          demo_manifest="$(mktemp)"
          dev_manifest="$(mktemp)"

          kubectl kustomize deploy/kustomize/authproxy-demo/overlays/demo >"${demo_manifest}"
          kubectl kustomize deploy/kustomize/authproxy-demo/overlays/dev >"${dev_manifest}"

          grep -q "name: demo-authproxy" "${demo_manifest}"
          grep -q "host: demo-postgresql" "${demo_manifest}"
          grep -q "address: demo-redis-master:6379" "${demo_manifest}"
          grep -q "secretName: demo-jwt" "${demo_manifest}"
          grep -q "name: demo-authproxy-migrate" "${demo_manifest}"
          grep -q "suspend: true" "${demo_manifest}"

          grep -q "name: dev-authproxy" "${dev_manifest}"
          grep -q "provider: miniredis" "${dev_manifest}"
          grep -q "provider: filesystem" "${dev_manifest}"
          grep -q -- "- --auto-migrate" "${dev_manifest}"
          if grep -q "authproxy-migrate" "${dev_manifest}"; then
            echo "Kustomize dev render included a cross-pod SQLite migration Job" >&2
            exit 1
          fi

          if grep -Eq "name: dev-(postgresql|redis-master|minio)$" "${dev_manifest}"; then
            echo "Kustomize dev render leaked backing service workloads" >&2
            exit 1
          fi

  install:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.6.1

      - name: List changed charts
        id: changed
        run: |
          changed=$(ct list-changed --config .github/ct.yaml --target-branch main)
          if [ -n "$changed" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Register Helm repos for chart dependencies
        if: steps.changed.outputs.found == 'true'
        # Same list as the lint job — `ct install` also runs `helm
        # dependency build` and needs the repos registered.
        run: |
          helm repo add ingress-nginx  https://kubernetes.github.io/ingress-nginx
          helm repo add jetstack       https://charts.jetstack.io
          helm repo add external-dns   https://kubernetes-sigs.github.io/external-dns/
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/
          helm repo add kedacore       https://kedacore.github.io/charts
          helm repo update

      - name: Set up Docker Buildx
        if: steps.changed.outputs.found == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build local AuthProxy image (amd64-only)
        if: steps.changed.outputs.found == 'true'
        # Build the image from the PR's tree so the chart is tested against
        # the code on this branch, not whatever happens to be tagged `:main`
        # in GHCR. amd64-only keeps the build under ~5 min; the runner is
        # always amd64 anyway.
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: authproxy:ci-local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create kind cluster
        if: steps.changed.outputs.found == 'true'
        uses: helm/kind-action@v1.10.0
        with:
          version: v0.24.0
          node_image: kindest/node:v1.30.4
          wait: 120s

      - name: Load local image into kind
        if: steps.changed.outputs.found == 'true'
        run: kind load docker-image authproxy:ci-local --name chart-testing

      - name: Create test namespace
        if: steps.changed.outputs.found == 'true'
        run: kubectl create namespace authproxy-ct

      - name: Deploy in-cluster database dependencies
        if: steps.changed.outputs.found == 'true'
        run: |
          # Deployed into the same namespace as `ct install` so the chart's
          # short service names resolve via in-namespace DNS.
          kubectl apply -n authproxy-ct -f - <<'EOF'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: redis
            labels: { app: redis }
          spec:
            replicas: 1
            selector: { matchLabels: { app: redis } }
            template:
              metadata: { labels: { app: redis } }
              spec:
                containers:
                  - name: redis
                    image: redis:7-alpine
                    args: ["--save", "", "--appendonly", "no"]
                    ports: [{ name: redis, containerPort: 6379 }]
                    readinessProbe:
                      exec: { command: ["redis-cli", "ping"] }
                      periodSeconds: 2
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: redis
          spec:
            selector: { app: redis }
            ports:
              - port: 6379
                targetPort: redis
                name: redis
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: postgres
            labels: { app: postgres }
          spec:
            replicas: 1
            selector: { matchLabels: { app: postgres } }
            template:
              metadata: { labels: { app: postgres } }
              spec:
                containers:
                  - name: postgres
                    image: postgres:16-alpine
                    env:
                      - { name: POSTGRES_DB, value: authproxy }
                      - { name: POSTGRES_USER, value: authproxy }
                      - { name: POSTGRES_PASSWORD, value: authproxy }
                    ports: [{ name: postgres, containerPort: 5432 }]
                    readinessProbe:
                      exec: { command: ["pg_isready", "-U", "authproxy", "-d", "authproxy"] }
                      periodSeconds: 2
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: postgres
          spec:
            selector: { app: postgres }
            ports:
              - port: 5432
                targetPort: postgres
                name: postgres
          EOF
          kubectl -n authproxy-ct rollout status deployment/redis --timeout=60s
          kubectl -n authproxy-ct rollout status deployment/postgres --timeout=60s

      - name: Generate crypto material + apply as K8s Secrets
        if: steps.changed.outputs.found == 'true'
        run: |
          set -eu
          workdir=$(mktemp -d)

          # JWT signing keypair (RSA-2048; AuthProxy reads system/system.pub).
          openssl genrsa -out "$workdir/system" 2048 2>/dev/null
          openssl rsa -in "$workdir/system" -pubout -out "$workdir/system.pub" 2>/dev/null

          # Global AES key (32 random bytes).
          openssl rand -out "$workdir/global_aes.key" 32

          # One admin actor keypair so the actors keys_path directory has at
          # least one valid actor (smoke happy path).
          openssl genrsa -out "$workdir/ci" 2048 2>/dev/null
          openssl rsa -in "$workdir/ci" -pubout -out "$workdir/ci.pub" 2>/dev/null

          # Namespace was created in a prior step (so Redis could land in it).
          kubectl -n authproxy-ct create secret generic authproxy-jwt \
            --from-file=system="$workdir/system" \
            --from-file=system.pub="$workdir/system.pub"
          kubectl -n authproxy-ct create secret generic authproxy-encryption \
            --from-file=global_aes.key="$workdir/global_aes.key"
          kubectl -n authproxy-ct create secret generic authproxy-db \
            --from-literal=AUTHPROXY_DB_PASSWORD=authproxy
          # Actor keypair files mount as <actors.mountPath>/<key>; key names
          # carry no slashes (K8s Secret data keys can't), so files like
          # `ci` and `ci.pub` are how the actors loader reads pairs.
          kubectl -n authproxy-ct create secret generic authproxy-actors \
            --from-file=ci="$workdir/ci" \
            --from-file=ci.pub="$workdir/ci.pub"

      - name: ct install
        if: steps.changed.outputs.found == 'true'
        # chart-testing auto-installs each chart once per
        # <chart>/ci/*-values.yaml file. AuthProxy's Postgres/Redis CI
        # values point at the local image loaded above and provide the
        # minimum config needed for the runtime validator. Keep install-only
        # flags out of helm-extra-args because ct also forwards these arguments
        # to helm test and helm uninstall.
        run: |
          ct install \
            --config .github/ct.yaml \
            --target-branch main \
            --namespace authproxy-ct \
            --helm-extra-args "--timeout=5m"
